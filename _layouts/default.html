<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0e1a">
  {% seo %}
  <link rel="preload" href="{{ '/assets/fonts/space-grotesk-latin-600-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
